name: Apple Silicon evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-live-runtime-health:
    # Opt-in: this needs a dedicated Apple Silicon runner and a live runtime
    # endpoint. Without the repository variable it stays unrequested, so tagging
    # a release does not queue a job that no runner can ever claim.
    if: >-
      vars.MLX_AGENT_LIVE_RUNTIME_HEALTH == '1'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, apple-silicon]
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require a configured live supported-runtime endpoint
        env:
          MLX_AGENT_RUNTIME_HEALTH_ENDPOINT: ${{ secrets.MLX_AGENT_RUNTIME_HEALTH_ENDPOINT }}
        run: |
          test -n "$MLX_AGENT_RUNTIME_HEALTH_ENDPOINT"
          curl --fail --silent --show-error --max-time 15 "$MLX_AGENT_RUNTIME_HEALTH_ENDPOINT"
      - name: Probe an installed tool-use candidate
        if: ${{ vars.MLX_AGENT_LIVE_TOOL_USE == '1' }}
        env:
          MLX_AGENT_LIVE_TOOL_USE: 1
        run: PYTHONPATH=src python3 -m unittest tests.integration.test_tool_use_live -v
      - name: Verify the release package after the health check
        run: |
          PYTHONPATH=src python3 scripts/validate_contracts.py
          PYTHONPATH=src python3 scripts/generate_adapters.py --check
