name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-guard:
    name: Pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on the base commit judges every change.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  contracts-and-install-lifecycle:
    name: ${{ matrix.os }} / Python 3.12
    needs: [pin-guard]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development validators
        run: python -m pip install -r requirements-dev.txt
      - name: Install native mesh test dependencies
        if: runner.os == 'macOS'
        run: python -m pip install --require-hashes -r src/mlx_agent/resources/backends/mlx-3d.lock
      - name: Compile all supported Python sources
        run: PYTHONPATH=src python -m compileall -q -x '/_lab/' src skills scripts tests
      - name: Validate that every declared version agrees
        run: python scripts/validate_release_version.py

      - name: Validate canonical contracts
        run: PYTHONPATH=src python scripts/validate_contracts.py
      - name: Validate Draft 2020-12 schemas and runtime parity
        run: PYTHONPATH=src python scripts/validate_json_schemas.py
      - name: Detect generated adapter drift
        run: PYTHONPATH=src python scripts/generate_adapters.py --check
      - name: Detect generated compatibility-documentation drift
        run: PYTHONPATH=src python scripts/render_compatibility.py --check
      - name: Run full unit integration and contract discovery
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Discover from recorded provider responses on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64"
          MLX_AGENT_FIXTURE=tests/fixtures/scout_responses.json PYTHONPATH=src python -m mlx_agent discover --fast --limit 1 --json
      - name: Evaluate the MCP server
        id: mcp-eval
        uses: cavi-ai/mcp-eval@main
        env:
          MCPEVAL_HOME: ${{ runner.temp }}/mlx-agent-mcpeval
        with:
          server: mlx-agent
          manifest: mcp-eval.manifest.json
          command: python scripts/mlx-agent-mcp
          report-path: .run/mcp-eval/report.json
      - name: Upload MCP evaluation report
        if: ${{ always() && steps.mcp-eval.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-eval-${{ matrix.os }}-python-3.12
          path: |
            .run/mcp-eval/report.json
            .run/mcp-eval/report.md
          include-hidden-files: true
          if-no-files-found: error
      - name: Reject whitespace errors
        run: git diff --check

  coverage:
    name: Coverage / Python 3.12
    needs: [pin-guard]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lab.txt
      - name: Install development validators and the experiment runtime
        run: python -m pip install -r requirements-dev.txt -r requirements-lab.txt
      - name: Install media inspection tools
        run: brew install ffmpeg
      - name: Run full discovery under coverage
        env:
          COVERAGE_CORE: sysmon
        run: |
          mkdir -p .run
          PYTHONPATH=src python -m coverage run -m unittest discover -s tests
      - name: Hold the line coverage floor
        run: |
          python -m coverage xml -o .run/coverage.xml --fail-under=0
          python -m coverage report
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-macos-python-3.12
          path: .run/coverage.xml
          if-no-files-found: warn


  experiment-engine:
    name: Optional experiment engine / Python 3.12
    needs: [pin-guard]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lab.txt
            requirements-lab-inference.txt
      - name: Install optional engine and regression dependencies
        run: python -m pip install -r requirements-lab-inference.txt pytest 'pytest-xdist==3.8.0'
      - name: Install media inspection tools
        run: brew install ffmpeg
      - name: Install compatibility entrypoint for replay tests
        run: |
          python -c 'import sysconfig; from pathlib import Path; root=Path.cwd(); target=Path(sysconfig.get_path("scripts"))/"video-lab"; target.write_text("#!"+__import__("sys").executable+"\nimport sys\nsys.path[:0] = "+repr([str(root/"src"),str(root/"src/mlx_agent/_lab")])+"\nfrom video_lab.launcher import main\nmain()\n"); target.chmod(0o755)'
      - name: Shared experiment workflow
        run: PYTHONPATH=src python -m unittest tests.integration.test_lab_cli tests.integration.test_lab_workspace -v
      - name: Retained experiment and training regressions
        run: |
          mkdir -p .run
          PYTHONPATH=src/mlx_agent/_lab:src python -m pytest lab_tests -n 4 --dist loadfile --durations=15 --basetemp=.run/engine-temp

  pin-consumers:
    # A green main moves the engine pin in mlx-workbench through its pin-engine workflow.
    needs: [contracts-and-install-lifecycle, coverage, experiment-engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to mlx-workbench
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/mlx-workbench/dispatches --method POST -f event_type=server-merged
