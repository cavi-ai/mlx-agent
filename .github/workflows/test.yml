name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merged-pr:
    # A main push whose exact tree passed this workflow on its merged pull request skips the suite steps.
    # The suite jobs still run and pass, so pin-consumers keeps its needs.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.pr.outputs.tested }}
      experiment: ${{ steps.experiment.outputs.run }}
    steps:
      - id: pr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          [ -n "$head" ] || exit 0
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha || true)
          [ -n "$tree" ] && [ "$tree" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha || true)" ] || exit 0
          workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=success&head_sha=$head" --jq "[.workflow_runs[] | select(.path == \"${workflow%@*}\")] | length" || echo 0)
          if [ "$passed" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pr.outputs.tested != 'true'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether experiment tests are needed
        id: experiment
        if: steps.pr.outputs.tested != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths="$RUNNER_TEMP/experiment-paths"
          if ! git diff --name-only --no-renames -z "$BASE" "$GITHUB_SHA" -- > "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip only paths outside the canonical experiment engine and its shared dependencies.
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|site/*|.github/assets/*|README.md|CHANGELOG.md|CONTRIBUTING.md|GLOSSARY.md|providers/*) ;;
              src/mlx_agent/front_door.py|src/mlx_agent/http_relay.py|src/mlx_agent/mcp_server.py|src/mlx_agent/service_registry.py) ;;
              tests/unit/test_front_door.py|tests/unit/test_mcp*.py|tests/unit/test_service_registry.py|tests/integration/test_mcp_stdio.py) ;;
              *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done < "$paths"
          echo "run=false" >> "$GITHUB_OUTPUT"

  pin-guard:
    name: Pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on the base commit judges every change.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  contracts-and-install-lifecycle:
    name: ${{ matrix.os }} / Python 3.12
    needs: [pin-guard, merged-pr]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            requirements: |
              requirements-dev.txt
              requirements-lab.txt
          - os: macos-latest
            requirements: requirements-dev.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.merged-pr.outputs.tested != 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install development validators
        if: needs.merged-pr.outputs.tested != 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Install the coverage runtime and media tools
        if: runner.os == 'Linux' && needs.merged-pr.outputs.tested != 'true'
        run: |
          python -m pip install -r requirements-lab.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Audit optional backend locks
        if: runner.os == 'Linux' && needs.merged-pr.outputs.tested != 'true'
        run: |
          for lock in src/mlx_agent/resources/backends/*.lock; do
            python -m pip_audit --no-deps --disable-pip --require-hashes -r "$lock" --progress-spinner off
          done
      - name: Install native mesh test dependencies
        if: runner.os == 'macOS' && needs.merged-pr.outputs.tested != 'true'
        run: python -m pip install --require-hashes -r src/mlx_agent/resources/backends/mlx-3d.lock
      - name: Compile all supported Python sources
        if: needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python -m compileall -q -x '/_lab/' src skills scripts tests
      - name: Validate that every declared version agrees
        if: needs.merged-pr.outputs.tested != 'true'
        run: python scripts/validate_release_version.py

      - name: Validate canonical contracts
        if: needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python scripts/validate_contracts.py
      - name: Validate Draft 2020-12 schemas and runtime parity
        if: needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python scripts/validate_json_schemas.py
      - name: Detect generated adapter drift
        if: needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python scripts/generate_adapters.py --check
      - name: Detect generated compatibility-documentation drift
        if: needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python scripts/render_compatibility.py --check
      - name: Run full unit integration and contract discovery
        if: runner.os == 'macOS' && needs.merged-pr.outputs.tested != 'true'
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run full discovery under coverage
        if: runner.os == 'Linux' && needs.merged-pr.outputs.tested != 'true'
        env:
          COVERAGE_CORE: sysmon
        run: |
          mkdir -p .run
          PYTHONPATH=src python -m coverage run -m unittest discover -s tests -v
          python -m coverage xml -o .run/coverage.xml --fail-under=0
          python -m coverage report
      - name: Upload coverage report
        if: runner.os == 'Linux' && needs.merged-pr.outputs.tested != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-3.12
          path: .run/coverage.xml
          include-hidden-files: true
          if-no-files-found: error
      - name: Discover from recorded provider responses on Apple Silicon
        if: runner.os == 'macOS' && needs.merged-pr.outputs.tested != 'true'
        run: |
          test "$(uname -m)" = "arm64"
          MLX_AGENT_FIXTURE=tests/fixtures/scout_responses.json PYTHONPATH=src python -m mlx_agent discover --fast --limit 1 --json
      - name: Evaluate the MCP server
        id: mcp-eval
        if: needs.merged-pr.outputs.tested != 'true'
        uses: cavi-ai/mcp-eval@main
        env:
          MCPEVAL_HOME: ${{ runner.temp }}/mlx-agent-mcpeval
        with:
          server: mlx-agent
          manifest: mcp-eval.manifest.json
          command: python scripts/mlx-agent-mcp
          report-path: .run/mcp-eval/report.json
      - name: Upload MCP evaluation report
        if: ${{ always() && steps.mcp-eval.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-eval-${{ matrix.os }}-python-3.12
          path: |
            .run/mcp-eval/report.json
            .run/mcp-eval/report.md
          include-hidden-files: true
          if-no-files-found: error
      - name: Reject whitespace errors
        if: needs.merged-pr.outputs.tested != 'true'
        run: git diff --check

  coverage:
    name: Coverage / Python 3.12
    needs: [merged-pr, contracts-and-install-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.merged-pr.outputs.tested != 'true'
        with:
          name: coverage-python-3.12
          path: .run
      - name: Verify the coverage report
        if: needs.merged-pr.outputs.tested != 'true'
        run: test -s .run/coverage.xml


  experiment-engine:
    name: Optional experiment engine / Python 3.12
    needs: [pin-guard, merged-pr]
    runs-on: ${{ needs.merged-pr.outputs.tested != 'true' && needs.merged-pr.outputs.experiment != 'false' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Record why the experiment suite is skipped
        if: runner.os == 'Linux'
        run: echo 'Experiment suite already checked for this tree or unaffected by the changed paths.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: runner.os == 'macOS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lab.txt
            requirements-lab-inference.txt
      - name: Install optional engine and regression dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-lab-inference.txt pytest 'pytest-xdist==3.8.0'
      - name: Install media inspection tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install compatibility entrypoint for replay tests
        if: runner.os == 'macOS'
        run: |
          python -c 'import sysconfig; from pathlib import Path; root=Path.cwd(); target=Path(sysconfig.get_path("scripts"))/"video-lab"; target.write_text("#!"+__import__("sys").executable+"\nimport sys\nsys.path[:0] = "+repr([str(root/"src"),str(root/"src/mlx_agent/_lab")])+"\nfrom video_lab.launcher import main\nmain()\n"); target.chmod(0o755)'
      - name: Shared experiment workflow
        if: runner.os == 'macOS'
        run: PYTHONPATH=src python -m unittest tests.integration.test_lab_cli tests.integration.test_lab_workspace -v
      - name: Retained experiment and training regressions
        if: runner.os == 'macOS'
        run: |
          mkdir -p .run
          PYTHONPATH=src/mlx_agent/_lab:src python -m pytest lab_tests -n 4 --dist loadfile --durations=15 --basetemp=.run/engine-temp

  pin-consumers:
    # A green main moves the engine pin in mlx-workbench through its pin-engine workflow.
    needs: [contracts-and-install-lifecycle, coverage, experiment-engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to mlx-workbench
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/mlx-workbench/dispatches --method POST -f event_type=server-merged
