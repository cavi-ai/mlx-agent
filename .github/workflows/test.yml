name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-guard:
    name: Pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on the base commit judges every change.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  contracts-and-install-lifecycle:
    name: ${{ matrix.os }} / Python 3.12
    needs: pin-guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development validators
        run: python -m pip install -r requirements-dev.txt
      - name: Audit optional backend locks
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: |
          for lock in src/mlx_agent/resources/backends/*.lock; do
            python -m pip_audit --no-deps --disable-pip --require-hashes -r "$lock" --progress-spinner off
          done
      - name: Install native mesh test dependencies
        if: runner.os == 'macOS'
        run: python -m pip install --require-hashes -r src/mlx_agent/resources/backends/mlx-3d.lock
      - name: Compile all supported Python sources
        if: runner.os == 'Linux'
        run: PYTHONPATH=src python -m compileall -q -x '/_lab/' src skills scripts tests
      - name: Validate that every declared version agrees
        if: runner.os == 'Linux'
        run: python scripts/validate_release_version.py

      - name: Validate canonical contracts
        if: runner.os == 'Linux'
        run: PYTHONPATH=src python scripts/validate_contracts.py
      - name: Validate Draft 2020-12 schemas and runtime parity
        if: runner.os == 'Linux'
        run: PYTHONPATH=src python scripts/validate_json_schemas.py
      - name: Detect generated adapter drift
        if: runner.os == 'Linux'
        run: PYTHONPATH=src python scripts/generate_adapters.py --check
      - name: Detect generated compatibility-documentation drift
        if: runner.os == 'Linux'
        run: PYTHONPATH=src python scripts/render_compatibility.py --check
      - name: Check native model ports and macOS process and capture behavior
        if: runner.os == 'macOS'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/unit -t . -p 'test_port_*.py' -v
          PYTHONPATH=src python -m unittest -v \
            tests.unit.test_music_speed tests.unit.test_triposg_denoiser_cache \
            tests.unit.test_process_table tests.unit.test_coding_capture tests.unit.test_coding_capture_storage \
            tests.unit.test_front_door tests.integration.test_capture_platform tests.integration.test_mcp_stdio
      - name: Run full unit integration and contract discovery
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Discover from recorded provider responses on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64"
          MLX_AGENT_FIXTURE=tests/fixtures/scout_responses.json PYTHONPATH=src python -m mlx_agent discover --fast --limit 1 --json
      - name: Evaluate the MCP server
        id: mcp-eval
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: cavi-ai/mcp-eval@main
        env:
          MCPEVAL_HOME: ${{ runner.temp }}/mlx-agent-mcpeval
        with:
          server: mlx-agent
          manifest: mcp-eval.manifest.json
          command: python scripts/mlx-agent-mcp
          report-path: .run/mcp-eval/report.json
      - name: Upload MCP evaluation report
        if: ${{ always() && steps.mcp-eval.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-eval-${{ matrix.os }}-python-3.12
          path: |
            .run/mcp-eval/report.json
            .run/mcp-eval/report.md
          include-hidden-files: true
          if-no-files-found: error
      - name: Reject whitespace errors
        if: runner.os == 'Linux'
        run: git diff --check

  coverage:
    name: Coverage / Python 3.12
    needs: pin-guard
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lab.txt
      - name: Install the coverage runtime and media tools
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-lab.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Run full discovery and enforce the coverage floor
        env:
          COVERAGE_CORE: sysmon
        run: |
          mkdir -p .run
          PYTHONPATH=src python -m coverage run -m unittest discover -s tests -v
          python -m coverage xml -o .run/coverage.xml --fail-under=0
          python -m coverage report
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-macos-python-3.12
          path: .run/coverage.xml
          include-hidden-files: true
          if-no-files-found: warn


  experiment-engine:
    name: Optional experiment engine / Python 3.12
    needs: pin-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lab.txt
      - name: Install experiment smoke dependencies
        run: |
          python -m pip install -r requirements-lab.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Run experiment CLI and workspace checks
        run: |
          PYTHONPATH=src python - <<'PYTHON'
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.integration.test_lab_cli",
              "tests.integration.test_lab_workspace",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PYTHON

  pin-consumers:
    # A green main moves the engine pin in mlx-workbench through its pin-engine workflow.
    needs: [contracts-and-install-lifecycle, coverage, experiment-engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch server-merged to mlx-workbench
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/mlx-workbench/dispatches --method POST -f event_type=server-merged
